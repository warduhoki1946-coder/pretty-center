<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretty Center | Swim & Gym</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="card">
<div class="hero">
    <img src="cover.jpg" class="cover" alt="Pretty Center">
    <div class="hero-overlay"></div>
</div>

<img src="logo.png" class="logo" alt="Pretty Center Logo">

<h1>Pretty Center</h1>
<h2>Swim & Gym</h2>

<p class="subtitle">
Everything you need for swimming & fitness
</p>

<p class="subtitle-ar">
كل ما تحتاجه للسباحة والرياضة
</p>
        </p>

        <div class="buttons">

            <a href="#" class="btn instagram">
                <i class="fab fa-instagram"></i>
                Instagram
            </a>

            <a href="#" class="btn tiktok">
                <i class="fab fa-tiktok"></i>
                TikTok
            </a>

            <a href="#" class="btn snapchat">
                <i class="fab fa-snapchat"></i>
                Snapchat
            </a>

            <a href="#" class="btn whatsapp">
                <i class="fab fa-whatsapp"></i>
                WhatsApp
            </a>

            <a href="#" class="btn call">
                <i class="fas fa-phone"></i>
                Call Now
            </a>

            <a href="#" class="btn location">
                <i class="fas fa-location-dot"></i>
                Store Location
            </a>

        </div>

        <div class="info">

            <p>
                <i class="fas fa-location-dot"></i>
                Duhok - Iraq
            </p>

            <p>
                <i class="far fa-clock"></i>
                Open Daily
            </p>

            <h3>9:00 AM – 8:00 PM</h3>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
